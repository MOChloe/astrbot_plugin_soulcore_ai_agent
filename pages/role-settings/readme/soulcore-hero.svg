<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">SoulCore</title>
  <desc id="description">让角色在每一次交流里，都更像自己。像平常一样聊天即可，SoulCore 会自行整理并延续角色需要的上下文，无需手动维护。</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1150" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d213e"/>
      <stop offset="0.52" stop-color="#493460"/>
      <stop offset="1" stop-color="#241a33"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(288 306) rotate(90) scale(254)">
      <stop stop-color="#a981d0" stop-opacity="0.22"/>
      <stop offset="0.62" stop-color="#735390" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#3e2c53" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="72" y1="52" x2="512" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#725394" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#3b294f" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="plume" x1="370" y1="110" x2="880" y2="1140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0e2fb"/>
      <stop offset="0.48" stop-color="#d2b1ec"/>
      <stop offset="1" stop-color="#b98cde"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(599 641) rotate(47) scale(150)">
      <stop stop-color="#fffbed"/>
      <stop offset="0.68" stop-color="#f5e6ca"/>
      <stop offset="1" stop-color="#e4c797"/>
    </radialGradient>
    <linearGradient id="light" x1="64" y1="70" x2="524" y2="562" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#ead8fa" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <style>
    .core-group{transform-box:fill-box;transform-origin:center;animation:core-breathe 8s ease-in-out infinite}
    .core-glow{animation:glow-breathe 8s ease-in-out infinite}
    .light-flow{stroke-dasharray:95 530;animation:light-travel 8s ease-in-out infinite}
    .particle-a{animation:drift-a 8s ease-in-out infinite}
    .particle-b{animation:drift-b 8s ease-in-out infinite}
    .particle-c{animation:drift-c 8s ease-in-out infinite}
    @keyframes core-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
    @keyframes glow-breathe{0%,100%{opacity:.18}50%{opacity:.48}}
    @keyframes light-travel{0%{stroke-dashoffset:625;opacity:0}18%{opacity:.65}72%{opacity:.65}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes drift-a{0%,100%{transform:translate(0,0);opacity:.3}50%{transform:translate(7px,-9px);opacity:.8}}
    @keyframes drift-b{0%,100%{transform:translate(0,0);opacity:.45}50%{transform:translate(-6px,8px);opacity:.75}}
    @keyframes drift-c{0%,100%{transform:translate(0,0);opacity:.22}50%{transform:translate(4px,-6px);opacity:.58}}
    @media (prefers-reduced-motion: reduce){.core-group,.core-glow,.light-flow,.particle-a,.particle-b,.particle-c{animation:none}}
  </style>
  <rect width="1200" height="620" rx="42" fill="url(#background)"/>
  <circle cx="1060" cy="-20" r="330" fill="#9d75c1" opacity="0.055"/>
  <circle cx="1040" cy="640" r="360" fill="#100b19" opacity="0.2"/>
  <rect x="58" y="45" width="478" height="530" rx="86" fill="url(#panel)" stroke="#d7b9ef" stroke-opacity="0.15"/>
  <circle cx="294" cy="310" r="255" fill="url(#halo)"/>
  <path class="light-flow" d="M103 434C32 272 122 92 288 68c158-22 276 102 245 253" fill="none" stroke="url(#light)" stroke-width="3" stroke-linecap="round"/>
  <circle class="particle-a" cx="96" cy="181" r="4" fill="#e6d4f7"/>
  <circle class="particle-b" cx="492" cy="151" r="3" fill="#f6e8cf"/>
  <circle class="particle-c" cx="475" cy="475" r="5" fill="#ceb0ea"/>
  <g transform="translate(5 22) scale(.46)" shape-rendering="geometricPrecision">
    <path fill="url(#plume)" fill-rule="evenodd" d="M797 283 767 302 749 320 738 335 725 360 720 375 714 413 716 443 723 467 731 484 749 509 794 550 820 579 841 615 851 648 853 685 849 714 843 736 832 762 817 786 790 815 788 813 804 792 820 762 828 739 833 712 831 666 825 645 814 622 796 597 778 579 754 562 725 547 703 539 669 532 631 531 605 535 632 540 663 551 693 567 721 588 747 615 764 640 779 675 786 711 786 741 782 767 774 791 758 821 738 847 709 876 659 919 635 943 615 970 602 999 598 1019 598 1045 605 1073 624 1105 640 1121 661 1136 637 1105 627 1085 621 1065 620 1037 623 1022 631 1002 651 972 686 937 737 897 808 847 843 814 859 793 876 762 886 734 891 710 893 679 886 633 872 599 842 554 833 532 831 518 833 467 828 447 813 419 781 379 770 351 770 330 773 318 783 299ZM750 424 767 465 782 485 813 517 822 532 820 534 790 510 772 491 763 478 750 446 748 426Z"/>
    <path fill="url(#plume)" fill-rule="evenodd" d="M664 83 678 112 685 145 685 170 682 187 666 221 650 241 612 277 572 306 494 355 479 367 459 388 438 423 428 452 422 487 422 524 420 526 417 520 414 498 414 467 421 431 432 405 419 415 395 440 375 467 360 494 349 523 344 546 343 581 345 596 351 619 364 647 374 662 395 686 393 688 377 676 351 645 337 614 333 589 327 623 328 661 334 693 343 719 359 747 376 766 402 785 429 797 460 805 458 807 435 807 417 804 400 798 384 789 399 812 419 833 453 855 489 866 530 866 566 856 568 858 546 871 529 877 515 878 551 887 581 886 614 879 638 880 646 883 655 891 658 898 655 910 670 896 682 877 685 865 683 849 675 837 655 821 590 790 563 774 548 762 527 739 511 709 504 676 505 647 514 618 495 642 489 655 482 681 482 715 487 738 495 758 493 760 485 748 476 726 471 699 471 674 480 636 500 596 536 548 607 471 644 424 665 392 686 354 701 321 715 282 726 226 726 195 721 167 713 144 698 118 685 102ZM549 800 551 798 572 809 628 830 642 839 657 855 655 857 642 846 622 836 589 825 570 816ZM669 288 671 290 663 312 648 340 631 364 592 405 509 483 484 511 460 546 447 574 437 612 435 635 436 662 439 678 437 682 431 666 427 643 427 605 436 567 452 533 466 511 494 477 528 443 603 377 631 348 652 320Z"/>
    <g class="core-group">
      <circle class="core-glow" cx="631" cy="675" r="132" fill="#f7dfb6" filter="url(#soft-glow)" opacity="0.3"/>
      <circle cx="631" cy="675" r="94" fill="url(#core)" stroke="#fff8e8" stroke-width="3"/>
    </g>
  </g>
  <text x="598" y="273" fill="#fffdfd" font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="82" font-weight="720" letter-spacing="-2">SoulCore</text>
  <rect x="602" y="304" width="72" height="3" rx="1.5" fill="#c9a6e7"/>
  <text x="598" y="365" fill="#efe8f5" font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="31" font-weight="450">让角色在每一次交流里，都更像自己。</text>
  <text x="598" y="432" fill="#f7f1fb" font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="23" font-weight="650">像平常一样聊天即可。</text>
  <text x="598" y="469" fill="#cfc0da" font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18.5">SoulCore 会自行整理并延续角色需要的上下文，无需手动维护。</text>
</svg>
